{% if jobs %}
<div class="table-wrap"><table>
  <thead><tr><th>任务</th><th>状态</th><th>开始</th><th>进度</th></tr></thead>
  <tbody>
  {% for job in jobs %}
  <tr><td>{{ job.title }}</td><td><span class="badge {{ job.status }}">{{ job.status|status }}</span></td>
    <td class="nowrap">{{ job.created_at|dt("%m-%d %H:%M") }}</td>
    <td class="small muted">{{ job.error or job.last_message or "" }}</td></tr>
  {% endfor %}
  </tbody>
</table></div>
{% else %}<p class="muted">本次启动后还没有任务。</p>{% endif %}
