services:
  db:
    image: pgvector/pgvector:pg17
    container_name: echo-db
    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: echo
      POSTGRES_DB: echo
    ports:
      - "${ECHO_DB_PORT:-5433}:5432"
    volumes:
      - echo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo -d echo"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  echo-pgdata:
